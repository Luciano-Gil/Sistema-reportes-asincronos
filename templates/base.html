{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="{% static 'estilos/home.css' %}">

    <!-- Inserta CSS extra de templates hijos -->
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container">
    <a class="navbar-brand" href="{% url 'login' %}">
      <i class="bi bi- joys-stick"></i> Gestor de Tareas
    </a>
    
    <div class="d-flex">
      {% if user.is_authenticated %}
        <span class="navbar-text me-3 text-white"><strong>{{ user.username }}</strong></span>
        <form action="{% url 'logout' %}" method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Ingresar</a>
        <a href="{% url 'signup' %}" class="btn btn-light btn-sm text-primary">Registrarse</a>
      {% endif %}
    </div>
  </div>
</nav>
    {% block content %}
    {% endblock content %}
    
</body>
